<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkipStream</title>
<link rel="stylesheet" href="popup.css">
</head>
<body data-tab="status">
<div class="card">

  <header class="header">
    <span class="logo" aria-hidden="true">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3,2 13,8 3,14"/><line x1="13" y1="2" x2="13" y2="14"/></svg>
    </span>
    <span class="header-title">SkipStream</span>
    <span class="ver-badge" id="versionBadge"></span>
    <button class="icon-btn theme-btn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle light or dark theme">
      <svg class="icon-sun" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="1" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="15" y2="8"/><line x1="3.05" y1="3.05" x2="4.46" y2="4.46"/><line x1="11.54" y1="11.54" x2="12.95" y2="12.95"/><line x1="12.95" y1="3.05" x2="11.54" y2="4.46"/><line x1="4.46" y1="11.54" x2="3.05" y2="12.95"/></svg>
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z"/></svg>
    </button>
  </header>

  <div class="tab-bar" role="tablist" aria-label="Sections">
    <button class="tab active" data-tab="status" role="tab" aria-selected="true" aria-controls="page-status">Status</button>
    <button class="tab" data-tab="settings" role="tab" aria-selected="false" aria-controls="page-settings">Settings</button>
    <span class="tab-ink" aria-hidden="true"></span>
  </div>

  <!-- STATUS page -->
  <section class="page" id="page-status" role="tabpanel" aria-label="Status">

    <div class="domain-strip" style="--i:0">
      <span class="domain-pill">
        <span id="domainDot"></span>
        <span id="domainLabel">Detecting tab...</span>
      </span>
    </div>

    <div class="master-block" style="--i:1">
      <div class="master-info">
        <h1 class="master-label">SkipStream</h1>
        <p class="master-sub" id="masterSub" aria-live="polite">Loading...</p>
      </div>
      <label class="toggle-lg">
        <input type="checkbox" id="masterToggle" aria-label="Enable SkipStream">
        <span class="slider-lg"></span>
      </label>
    </div>

    <div class="ledger" style="--i:2">
      <div class="led-row">
        <span class="led-lbl">Skips today</span>
        <span class="led-val" id="statSkips">0</span>
      </div>
      <div class="led-row">
        <span class="led-lbl">Time saved</span>
        <span class="led-val" id="statTime">0s</span>
      </div>
      <div class="led-row">
        <span class="led-lbl">Active mode</span>
        <span class="mode-badge off" id="modeBadge">Loading</span>
      </div>
    </div>

    <div class="action-bar" style="--i:3">
      <button class="action-btn" id="historyBtn">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg>
        History
      </button>
      <button class="action-btn" id="statsBtn">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="6.5" y="5" width="3" height="10" rx="1"/><rect x="12" y="1" width="3" height="14" rx="1"/></svg>
        Stats
      </button>
      <button class="action-btn gear" id="settingsBtn" title="Full settings" aria-label="Open full settings">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/><circle cx="10.5" cy="4" r="1.7" fill="currentColor" stroke="none"/><circle cx="5.5" cy="8" r="1.7" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </section>

  <!-- SETTINGS page -->
  <section class="page page-hidden" id="page-settings" role="tabpanel" aria-label="Settings">
    <div class="skip-inner">

      <div class="skip-section" style="--i:0">
        <h2 class="skip-label">Skip mode</h2>
        <div class="skip-mode-grid" role="radiogroup" aria-label="Skip mode">
          <button class="smode-chip" data-mode="off" role="radio" aria-checked="false"><span class="smc-name">Off</span><span class="smc-desc">Disabled</span></button>
          <button class="smode-chip" data-mode="prompt" role="radio" aria-checked="false"><span class="smc-name">Prompt</span><span class="smc-desc">Ask first</span></button>
          <button class="smode-chip" data-mode="auto-all" role="radio" aria-checked="false"><span class="smc-name">Auto all</span><span class="smc-desc">Everything</span></button>
          <button class="smode-chip" data-mode="auto-intro" role="radio" aria-checked="false"><span class="smc-name">Intros</span><span class="smc-desc">Only intros</span></button>
          <button class="smode-chip" data-mode="auto-recap" role="radio" aria-checked="false"><span class="smc-name">Recaps</span><span class="smc-desc">Only recaps</span></button>
          <button class="smode-chip" data-mode="auto-outro" role="radio" aria-checked="false"><span class="smc-name">Outros</span><span class="smc-desc">Only outros</span></button>
        </div>
      </div>

      <div class="skip-section" style="--i:1">
        <h2 class="skip-label">Segments</h2>
        <div class="stog-list">
          <label class="stog-row"><span>Skip intros</span><span class="stog-right"><input type="checkbox" id="skipIntro"><span class="stog-slider"></span></span></label>
          <label class="stog-row"><span>Skip recaps</span><span class="stog-right"><input type="checkbox" id="skipRecap"><span class="stog-slider"></span></span></label>
          <label class="stog-row"><span>Skip outros</span><span class="stog-right"><input type="checkbox" id="skipOutro"><span class="stog-slider"></span></span></label>
        </div>
      </div>

      <div class="skip-section" style="--i:2">
        <h2 class="skip-label">Playback</h2>
        <div class="stog-list">
          <label class="stog-row"><span>Resume where I left off</span><span class="stog-right"><input type="checkbox" id="resumePlayback"><span class="stog-slider"></span></span></label>
          <label class="stog-row"><span>Auto next episode</span><span class="stog-right"><input type="checkbox" id="autoNextEpisode"><span class="stog-slider"></span></span></label>
        </div>
      </div>

      <div class="skip-section" style="--i:3">
        <h2 class="skip-label">Speed</h2>
        <div class="speed-row" role="radiogroup" aria-label="Playback speed">
          <button class="speed-chip" data-rate="0.75" role="radio" aria-checked="false">0.75x</button>
          <button class="speed-chip" data-rate="1" role="radio" aria-checked="false">1x</button>
          <button class="speed-chip" data-rate="1.25" role="radio" aria-checked="false">1.25x</button>
          <button class="speed-chip" data-rate="1.5" role="radio" aria-checked="false">1.5x</button>
          <button class="speed-chip" data-rate="2" role="radio" aria-checked="false">2x</button>
        </div>
      </div>

      <div class="skip-section" style="--i:4">
        <h2 class="skip-label">Subtitles</h2>
        <div class="sub-row">
          <button class="sub-upload-btn" id="subUploadBtn">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2v8M5 5l3-3 3 3"/><path d="M2 12v2h12v-2"/></svg>
            Load .srt / .vtt
          </button>
          <button class="sub-clear-btn" id="subClearBtn" title="Clear loaded subtitle" aria-label="Clear loaded subtitle">&times;</button>
        </div>
        <span class="sub-status" id="subStatus">No subtitle loaded</span>
        <input type="file" id="subFileInput" accept=".srt,.vtt" style="display:none">
        <div class="sub-lang-row">
          <label class="skip-label" for="subLangSelect">Language</label>
          <select id="subLangSelect" class="sub-lang-select">
            <option value="en">English</option>
            <option value="ta">Tamil</option>
            <option value="hi">Hindi</option>
            <option value="te">Telugu</option>
            <option value="ml">Malayalam</option>
            <option value="bn">Bengali</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="pt">Portuguese</option>
            <option value="it">Italian</option>
            <option value="ru">Russian</option>
            <option value="ar">Arabic</option>
            <option value="zh-CN">Chinese (S)</option>
            <option value="zh-TW">Chinese (T)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="tr">Turkish</option>
            <option value="nl">Dutch</option>
            <option value="pl">Polish</option>
            <option value="sv">Swedish</option>
            <option value="uk">Ukrainian</option>
            <option value="vi">Vietnamese</option>
            <option value="id">Indonesian</option>
            <option value="fa">Persian</option>
            <option value="he">Hebrew</option>
            <option value="el">Greek</option>
          </select>
        </div>
      </div>

      <div class="skip-section" style="--i:5">
        <h2 class="skip-label">Accent</h2>
        <div class="swatch-row">
          <input type="color" id="seedColorPicker" value="#57A860" aria-label="Custom accent color">
          <button type="button" class="color-dot" data-color="#57A860" style="background:#57A860" aria-label="Green accent"></button>
          <button type="button" class="color-dot" data-color="#4285F4" style="background:#4285F4" aria-label="Blue accent"></button>
          <button type="button" class="color-dot" data-color="#EA4335" style="background:#EA4335" aria-label="Red accent"></button>
          <button type="button" class="color-dot" data-color="#FBBC04" style="background:#FBBC04" aria-label="Amber accent"></button>
          <button type="button" class="color-dot" data-color="#9C27B0" style="background:#9C27B0" aria-label="Purple accent"></button>
          <button type="button" class="color-dot" data-color="#FF6D00" style="background:#FF6D00" aria-label="Orange accent"></button>
        </div>
      </div>

    </div>
  </section>

</div>
<footer><a href="https://github.com/govinda-rajulu/openskip" target="_blank" rel="noopener">SkipStream on GitHub</a></footer>
<script src="theme-engine.js"></script>
<script src="popup.js"></script>
</body>
</html>
